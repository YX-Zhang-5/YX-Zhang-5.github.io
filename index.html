<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YX Zhang</title>
  <meta name="description" content="YX Zhang 的个人网站">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --line: #292524;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 16px 48px;
    }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); margin: 0 0 32px; }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 48px 0 12px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 12px 0; border-top: 1px solid var(--line); }
    li:last-child { border-bottom: 1px solid var(--line); }
    li span { display: block; color: var(--muted); font-size: 0.9rem; }
    .links a { margin-right: 20px; }
    footer { margin-top: 64px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>YX Zhang</h1>
    <p class="tagline">在这里写一句话介绍自己。</p>

    <p>欢迎来到我的个人网站。这里可以写几句你的背景、正在做的事情和感兴趣的方向。</p>

    <h2>项目</h2>
    <ul>
      <li>
        <a href="https://github.com/YX-Zhang-5/stock-ticker">stock-ticker</a>
        <span>股票实时行情显示网页</span>
      </li>
      <li>
        <a href="https://github.com/YX-Zhang-5/resume">resume</a>
        <span>个人简历</span>
      </li>
    </ul>

    <h2>联系</h2>
    <p class="links">
      <a href="https://github.com/YX-Zhang-5">GitHub</a>
    </p>

    <footer>© 2026 YX Zhang</footer>
  </main>
</body>
</html>
